<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Staff sign in | Vijay Hospitality</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/base.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/layout.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/components.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/app.css') }}"></head>
<body><div class="login"><a class="logo" href="/" style="margin-bottom:18px"><i>V</i><span>Vijay Hospitality<small>Staff sign in</small></span></a>{% for c,m in get_flashed_messages(with_categories=true) %}<div class="flash {{c}}">{{m}}</div>{% endfor %}
<form class="form" method="post" style="grid-template-columns:1fr"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input type="email" name="email" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn">Sign in</button></form></div></body></html>

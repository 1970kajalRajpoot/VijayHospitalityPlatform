{% extends 'admin/base.html' %}{% block title %}Users{% endblock %}
{% block content %}<h1>Users and roles</h1><form class="card row" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Role<select name="role"><option value="receptionist">Receptionist</option><option value="admin">Administrator</option>{% if user.role=='owner' %}<option value="owner">Owner</option>{% endif %}</select></label><label>Password (10+ chars, mixed case, a number)<input name="password" type="password" required autocomplete="new-password"></label><button class="btn sm">Create user</button></form>
<div class="card tw"><table class="t"><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th></th></tr>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.role|label}}</td><td>{{ 'Yes' if u.active else 'No' }}</td><td class="row"><form method="post" action="{{ url_for('admin.user_toggle',uid=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn sm plain">{{ 'Deactivate' if u.active else 'Activate' }}</button></form><form method="post" action="{{ url_for('admin.user_password',uid=u.id) }}" class="row"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="password" name="password" placeholder="New password" autocomplete="new-password"><button class="btn sm plain">Reset</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
